openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: UAT Test Case Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management operations
  - name: projects
    description: Test project operations
  - name: use-cases
    description: Use case operations
  - name: test-cases
    description: Test case operations
  - name: test-steps
    description: Test step operations
  - name: executions
    description: Test execution operations
  - name: attachments
    description: Attachment operations
  - name: upload
    description: File upload operations
  - name: dashboard
    description: Dashboard and reporting operations
  - name: test-runs
    description: Test run operations
  - name: defects
    description: Defect operations
  - name: bugs
    description: Bug operations
  - name: team-discussions
    description: Team discussion operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Projects ────────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all test projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestProject"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new test project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestProject"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a single project with full tree
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestProjectDetail"
        "404":
          description: Not found
    put:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestProject"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/sign-off:
    post:
      operationId: signOffProject
      tags: [projects]
      summary: Sign off a project (dual signature)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignOffBody"
      responses:
        "200":
          description: Sign-off registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  signOffData:
                    type: object

  /projects/{projectId}/sign-off-status:
    get:
      operationId: getSignOffStatus
      tags: [projects]
      summary: Get current sign-off status
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sign-off status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOffStatus"

  /projects/code/{projectCode}:
    get:
      operationId: getProjectByCode
      tags: [projects]
      summary: Get project by code (for tester login)
      parameters:
        - name: projectCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestProjectDetail"
        "404":
          description: Not found

  # ── Use Cases ─────────────────────────────────────────────────────────────
  /projects/{projectId}/use-cases:
    get:
      operationId: listUseCases
      tags: [use-cases]
      summary: List use cases for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of use cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UseCase"
    post:
      operationId: createUseCase
      tags: [use-cases]
      summary: Create a use case
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUseCaseBody"
      responses:
        "201":
          description: Created use case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseCase"

  /use-cases/{useCaseId}:
    put:
      operationId: updateUseCase
      tags: [use-cases]
      summary: Update a use case
      parameters:
        - name: useCaseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUseCaseBody"
      responses:
        "200":
          description: Updated use case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseCase"
    delete:
      operationId: deleteUseCase
      tags: [use-cases]
      summary: Delete a use case
      parameters:
        - name: useCaseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Test Cases ────────────────────────────────────────────────────────────
  /use-cases/{useCaseId}/test-cases:
    get:
      operationId: listTestCases
      tags: [test-cases]
      summary: List test cases for a use case
      parameters:
        - name: useCaseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of test cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestCase"
    post:
      operationId: createTestCase
      tags: [test-cases]
      summary: Create a test case
      parameters:
        - name: useCaseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestCaseBody"
      responses:
        "201":
          description: Created test case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCase"

  /test-cases/{testCaseId}:
    put:
      operationId: updateTestCase
      tags: [test-cases]
      summary: Update a test case
      parameters:
        - name: testCaseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestCaseBody"
      responses:
        "200":
          description: Updated test case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCase"
    delete:
      operationId: deleteTestCase
      tags: [test-cases]
      summary: Delete a test case
      parameters:
        - name: testCaseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Test Steps ────────────────────────────────────────────────────────────
  /test-cases/{testCaseId}/steps:
    get:
      operationId: listTestSteps
      tags: [test-steps]
      summary: List steps for a test case
      parameters:
        - name: testCaseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestStep"
    post:
      operationId: createTestStep
      tags: [test-steps]
      summary: Create a test step
      parameters:
        - name: testCaseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestStepBody"
      responses:
        "201":
          description: Created step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestStep"

  /test-cases/{testCaseId}/steps/bulk:
    post:
      operationId: bulkCreateTestSteps
      tags: [test-steps]
      summary: Bulk create test steps
      parameters:
        - name: testCaseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                steps:
                  type: array
                  items:
                    $ref: "#/components/schemas/CreateTestStepBody"
              required: [steps]
      responses:
        "201":
          description: Created steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestStep"

  /steps/{stepId}:
    put:
      operationId: updateTestStep
      tags: [test-steps]
      summary: Update a test step
      parameters:
        - name: stepId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestStepBody"
      responses:
        "200":
          description: Updated step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestStep"
    delete:
      operationId: deleteTestStep
      tags: [test-steps]
      summary: Delete a test step
      parameters:
        - name: stepId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Executions ────────────────────────────────────────────────────────────
  /test-cases/{testCaseId}/executions:
    get:
      operationId: listExecutions
      tags: [executions]
      summary: List executions for a test case
      parameters:
        - name: testCaseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestExecution"
    post:
      operationId: createExecution
      tags: [executions]
      summary: Submit a test execution result
      parameters:
        - name: testCaseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExecutionBody"
      responses:
        "201":
          description: Created execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestExecution"

  /executions/{executionId}:
    put:
      operationId: updateExecution
      tags: [executions]
      summary: Update an execution
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExecutionBody"
      responses:
        "200":
          description: Updated execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestExecution"

  /executions/{executionId}/steps/{stepId}/result:
    put:
      operationId: updateStepResult
      tags: [executions]
      summary: Update a step result for an execution
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: integer
        - name: stepId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStepResultBody"
      responses:
        "200":
          description: Updated step result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepResult"

  # ── Attachments ───────────────────────────────────────────────────────────
  /attachments:
    post:
      operationId: createAttachment
      tags: [attachments]
      summary: Add an attachment (URL or uploaded file reference)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttachmentBody"
      responses:
        "201":
          description: Created attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /attachments/{attachmentId}:
    delete:
      operationId: deleteAttachment
      tags: [attachments]
      summary: Delete an attachment
      parameters:
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /attachments/{entityType}/{entityId}:
    get:
      operationId: listAttachments
      tags: [attachments]
      summary: List all attachments for an entity
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
        - name: entityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"

  /upload:
    post:
      operationId: uploadFile
      tags: [upload]
      summary: Upload a file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  description: The file to upload (binary)
                  type: string
                entityType:
                  type: string
                entityId:
                  type: integer
                field:
                  type: string
      responses:
        "201":
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Overall system summary
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/projects/{projectId}/stats:
    get:
      operationId: getProjectStats
      tags: [dashboard]
      summary: Pass/fail stats for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  # ── Recent Activity ──────────────────────────────────────────────────────
  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent test execution activity
      responses:
        "200":
          description: Recent activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/developer/{userId}/bugs:
    get:
      operationId: getDeveloperBugs
      tags: [dashboard]
      summary: List bugs assigned to a developer
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Developer bug list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeveloperBugItem"

  # ── Test Runs ─────────────────────────────────────────────────────────────
  /projects/{projectId}/test-runs:
    get:
      operationId: listTestRuns
      tags: [test-runs]
      summary: List all test runs for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of test runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestRun"
    post:
      operationId: createTestRun
      tags: [test-runs]
      summary: Create a new test run
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestRunBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRunDetail"


  /test-runs/{testRunId}:
    get:
      operationId: getTestRun
      tags: [test-runs]
      summary: Get test run details
      parameters:
        - name: testRunId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Test run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRunDetail"
    patch:
      operationId: updateTestRun
      tags: [test-runs]
      summary: Update a test run
      parameters:
        - name: testRunId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTestRunBody"
      responses:
        "200":
          description: Updated test run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRunDetail"

  /test-runs/{testRunId}/use-cases:
    post:
      operationId: addUseCaseToTestRun
      tags: [test-runs]
      summary: Add a use case to a test run
      parameters:
        - name: testRunId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                useCaseId:
                  type: integer
              required: [useCaseId]
      responses:
        "201":
          description: Added use case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRunDetail"

  /test-runs/{testRunId}/use-cases/{testRunUseCaseId}:
    patch:
      operationId: updateTestRunUseCase
      tags: [test-runs]
      summary: Update a test run use case
      parameters:
        - name: testRunId
          in: path
          required: true
          schema:
            type: integer
        - name: testRunUseCaseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTestRunUseCaseBody"
      responses:
        "200":
          description: Updated use case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRunDetail"
    delete:
      operationId: removeUseCaseFromTestRun
      tags: [test-runs]
      summary: Remove a use case from a test run
      parameters:
        - name: testRunId
          in: path
          required: true
          schema:
            type: integer
        - name: testRunUseCaseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /test-runs/{testRunId}/use-cases/{useCaseId}/sync:
    post:
      operationId: syncTestRunUseCaseStatus
      tags: [test-runs]
      summary: Sync the status of a use case in a test run
      parameters:
        - name: testRunId
          in: path
          required: true
          schema:
            type: integer
        - name: useCaseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated test run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRunDetail"

  /test-runs/{testRunId}/re-run:
    post:
      operationId: rerunTestRun
      tags: [test-runs]
      summary: Create a re-run from a failed test run
      parameters:
        - name: testRunId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReRunBody"
      responses:
        "201":
          description: Created re-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRunDetail"

  /test-runs/{testRunId}/full-report:
    get:
      operationId: getTestRunFullReport
      tags: [test-runs]
      summary: Get full report data for a test run
      parameters:
        - name: testRunId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Detailed test run data
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /dashboard/tester/{userId}/test-runs:
    get:
      operationId: getTesterTestRuns
      tags: [test-runs]
      summary: List test runs for a specific tester
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of tester test runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TesterTestRun"

  /projects/{projectId}/test-runs/analytics:
    get:
      operationId: getTestRunAnalytics
      tags: [test-runs]
      summary: Get analytics for completed test runs
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of test run analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestRunAnalytics"

  # ── Authentication ────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login to the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRegistrationBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Duplicate username

  # ── Users & Assignments ───────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    put:
      operationId: updateUser
      tags: [users]
      summary: Update user details (Admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
