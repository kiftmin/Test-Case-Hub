              schema:
                $ref: "#/components/schemas/Defect"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    TestProject:
      type: object
      properties:
        id:
          type: integer
        projectCode:
          type: string
        name:
          type: string
        designedBy:
          type: string
        moduleName:
          type: string
        designDate:
          type: string
        testLink:
          type: string
          nullable: true
        testLeadId:
          type: integer
          nullable: true
        version:
          type: integer
        versionDate:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        isSignedOff:
          type: integer
        signOffData:
          type: string
          nullable: true
      required: [id, projectCode, name, designedBy, moduleName, designDate, version, versionDate, createdAt, updatedAt, isSignedOff]

    TestProjectDetail:
      allOf:
        - $ref: "#/components/schemas/TestProject"
        - type: object
          properties:
            useCases:
              type: array
              items:
                $ref: "#/components/schemas/UseCaseDetail"
          required: [useCases]

    CreateProjectBody:
      type: object
      properties:
        name:
          type: string
        designedBy:
          type: string
        moduleName:
          type: string
        designDate:
          type: string
        testLink:
          type: string
          nullable: true
        testLeadId:
          type: integer
          nullable: true
      required: [name, designedBy, moduleName, designDate]

    UseCase:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        code:
          type: string
        name:
          type: string
        createdAt:
          type: string
      required: [id, projectId, code, name, createdAt]

    UseCaseDetail:
      allOf:
        - $ref: "#/components/schemas/UseCase"
        - type: object
          properties:
            testCases:
              type: array
              items:
                $ref: "#/components/schemas/TestCaseDetail"
          required: [testCases]

    CreateUseCaseBody:
      type: object
      properties:
        name:
          type: string
      required: [name]

    TestCase:
      type: object
      properties:
        id:
          type: integer
        useCaseId:
          type: integer
        caseNumber:
          type: integer
        title:
          type: string
        createdAt:
          type: string
      required: [id, useCaseId, caseNumber, title, createdAt]

    TestCaseDetail:
      allOf:
        - $ref: "#/components/schemas/TestCase"
        - type: object
          properties:
            steps:
              type: array
              items:
                $ref: "#/components/schemas/TestStep"
            executions:
              type: array
              items:
                $ref: "#/components/schemas/TestExecution"
          required: [steps, executions]

    CreateTestCaseBody:
      type: object
      properties:
        title:
          type: string
      required: [title]

    TestStep:
      type: object
      properties:
        id:
          type: integer
        testCaseId:
          type: integer
        stepNumber:
          type: integer
        instruction:
          type: string
        testData:
          type: string
          nullable: true
        expectedResult:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
      required: [id, testCaseId, stepNumber, instruction, expectedResult, attachments]

    CreateTestStepBody:
      type: object
      properties:
        instruction:
          type: string
        testData:
          type: string
          nullable: true
        expectedResult:
          type: string
      required: [instruction, expectedResult]

    TestExecution:
      type: object
      properties:
        id:
          type: integer
        testCaseId:
          type: integer
        testRunId:
          type: integer
          nullable: true
        iterationNumber:
          type: integer
        testerName:
          type: string
        status:
          type: string
        executedAt:
          type: string
        stepResults:
          type: array
          items:
            $ref: "#/components/schemas/StepResult"
      required: [id, testCaseId, iterationNumber, testerName, status, executedAt]

    CreateExecutionBody:
      type: object
      properties:
        testerName:
          type: string
        status:
          type: string
        testRunId:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
      required: [testerName]

    StepResult:
      type: object
      properties:
        id:
          type: integer
        executionId:
          type: integer
        stepId:
          type: integer
        actualResult:
          type: string
          nullable: true
        comments:
          type: string
          nullable: true
        passed:
          type: boolean
          nullable: true
        recordedAt:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
      required: [id, executionId, stepId, recordedAt, attachments]

    CreateStepResultBody:
      type: object
      properties:
        actualResult:
          type: string
          nullable: true
        comments:
          type: string
          nullable: true
        passed:
          type: boolean
          nullable: true

    Attachment:
      type: object
      properties:
        id:
          type: integer
        entityType:
          type: string
        entityId:
          type: integer
        field:
          type: string
        fileName:
          type: string
        fileUrl:
          type: string
        fileType:
          type: string
        createdAt:
          type: string
      required: [id, entityType, entityId, field, fileName, fileUrl, fileType, createdAt]

    CreateAttachmentBody:
      type: object
      properties:
        entityType:
          type: string
        entityId:
          type: integer
        field:
          type: string
        fileName:
          type: string
        fileUrl:
          type: string
        fileType:
          type: string
      required: [entityType, entityId, field, fileName, fileUrl, fileType]

    DashboardSummary:
      type: object
      properties:
        totalProjects:
          type: integer
        totalTestCases:
          type: integer
        totalExecutions:
          type: integer
        passRate:
          type: number
        recentProjectsCount:
          type: integer
      required: [totalProjects, totalTestCases, totalExecutions, passRate, recentProjectsCount]

    ProjectStats:
      type: object
      properties:
        projectId:
          type: integer
        projectName:
          type: string
        totalTestCases:
          type: integer
        totalExecutions:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        pending:
          type: integer
        passRate:
          type: number
        useCaseBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/UseCaseStat"
      required: [projectId, projectName, totalTestCases, totalExecutions, passed, failed, pending, passRate, useCaseBreakdown]

    UseCaseStat:
      type: object
      properties:
        useCaseId:
          type: integer
        useCaseName:
          type: string
        passed:
          type: integer
        failed:
          type: integer
        pending:
          type: integer
      required: [useCaseId, useCaseName, passed, failed, pending]

    ActivityItem:
      type: object
      properties:
        executionId:
          type: integer
        testCaseName:
          type: string
        projectName:
          type: string
        testerName:
          type: string
        passed:
          type: boolean
          nullable: true
        executedAt:
          type: string
      required: [executionId, testCaseName, projectName, testerName, executedAt]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
      required: [id, username, name, role, isActive, createdAt]

    CreateUserBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
      required: [username, password, name, role]

    ProjectAssignment:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        userId:
          type: integer
        role:
          type: string
        assignedAt:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [id, projectId, userId, role, assignedAt]


    CreateProjectAssignmentBody:
      type: object
      properties:
        userId:
          type: integer
        role:
          type: string
      required: [userId, role]

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]
    
    TestRun:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [scheduled, in_progress, completed]
        scheduledAt:
          type: string
          format: date-time
        passed:
          type: boolean
          nullable: true
        sourceTestRunId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, projectId, name, status, scheduledAt, createdAt, updatedAt]

    TestRunDetail:
      allOf:
        - $ref: "#/components/schemas/TestRun"
        - type: object
          properties:
            useCases:
              type: array
              items:
                $ref: "#/components/schemas/TestRunUseCase"
          required: [useCases]

    TestRunUseCase:
      type: object
      properties:
        id:
          type: integer
        testRunId:
          type: integer
        useCaseId:
          type: integer
        useCaseCode:
          type: string
          nullable: true
        useCaseName:
          type: string
          nullable: true
        assignedTesterId:
          type: integer
          nullable: true
        assignedTesterName:
          type: string
          nullable: true
        assignedTesterUsername:
          type: string
          nullable: true
        freePass:
          type: boolean
        status:
          type: string
          enum: [pending, in_progress, passed, failed, passed_by_agreement]
        createdAt:
          type: string
          format: date-time
      required: [id, testRunId, useCaseId, freePass, status, createdAt]

    CreateTestRunBody:
      type: object
      properties:
        name:
          type: string
        scheduledAt:
          type: string
          format: date-time
        useCaseIds:
          type: array
          items:
            type: integer
      required: [name, scheduledAt]

    UpdateTestRunBody:
      type: object
      properties:
        name:
          type: string
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, in_progress, completed]

    UpdateTestRunUseCaseBody:
      type: object
      properties:
        assignedTesterId:
          type: integer
          nullable: true
        freePass:
          type: boolean
        status:
          type: string
          enum: [pending, in_progress, passed, failed, passed_by_agreement]

    ReRunBody:
      type: object
      properties:
        name:
          type: string
        scheduledAt:
          type: string
          format: date-time
        failedOnly:
          type: boolean
          default: false
      required: [name, scheduledAt]

    TesterTestRun:
      allOf:
        - $ref: "#/components/schemas/TestRun"
        - type: object
          properties:
            projectCode:
              type: string
            msUntilStart:
              type: integer
            isAvailable:
              type: boolean
            myUseCaseCount:
              type: integer
            myPendingCount:
              type: integer
          required: [projectCode, msUntilStart, isAvailable, myUseCaseCount, myPendingCount]

    TestRunAnalytics:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        scheduledAt:
          type: string
          format: date-time
        passed:
          type: boolean
          nullable: true
        totalUseCases:
          type: integer
        passedUseCases:
          type: integer
        failedUseCases:
          type: integer
        freePassCount:
          type: integer
        sourceTestRunId:
          type: integer
          nullable: true
      required: [id, name, scheduledAt, totalUseCases, passedUseCases, failedUseCases, freePassCount]

    # ── New Auth / User Schemas ──────────────────────────────────────────────
    CreateRegistrationBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        name:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [ADMIN, AUTHOR, USER]
      required: [username, password, name, role]

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [ADMIN, AUTHOR, USER]

    # ── Sign-Off Schemas ─────────────────────────────────────────────────────
    SignOffBody:
      type: object
      properties:
        role:
          type: string
          enum: [TEST_LEAD, BUSINESS_OWNER]
        note:
          type: string
      required: [role]

    SignOffStatus:
      type: object
      properties:
        isSignedOff:
          type: boolean
        testLeadSigned:
          type: boolean
        businessOwnerSigned:
          type: boolean
        signOffData:
          type: object

    # ── Defect Schemas ───────────────────────────────────────────────────────
    Defect:
      type: object
      properties:
        id:
          type: integer
        testRunId:
          type: integer
        testCaseId:
          type: integer
        executionId:
          type: integer
        testerNotes:
          type: string
          nullable: true
        status:
          type: string
        retestReason:
          type: string
          nullable: true
        acceptedByBusinessNote:
          type: string
          nullable: true
        rejectionLog:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        testCase:
          $ref: "#/components/schemas/TestCase"
          nullable: true
        execution:
          $ref: "#/components/schemas/TestExecution"
          nullable: true
        notes:
          type: array
          items:
            $ref: "#/components/schemas/DefectNote"
      required: [id, testRunId, testCaseId, executionId, status, createdAt, updatedAt]

    FlagRetestBody:
      type: object
      properties:
        reason:
          type: string
      required: [reason]

    BusinessAcceptBody:
      type: object
      properties:
        note:
          type: string
      required: [note]

    BusinessRejectBody:
      type: object
      properties:
        reason:
          type: string

    CreateDefectNoteBody:
      type: object
      properties:
        note:
          type: string
        discussionId:
          type: integer
          nullable: true
      required: [note]

    DefectNote:
      type: object
      properties:
        id:
          type: integer
        defectId:
          type: integer
        discussionId:
          type: integer
          nullable: true
        addedByUserId:
          type: integer
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        addedByUser:
          $ref: "#/components/schemas/User"
          nullable: true
      required: [id, defectId, addedByUserId, note, createdAt]

    StatusAuditLogEntry:
      type: object
      properties:
        id:
          type: integer
        entityType:
          type: string
        entityId:
          type: integer
        changedByUserId:
          type: integer
        fromStatus:
          type: string
        toStatus:
          type: string
        reason:
          type: string
          nullable: true
        changedAt:
          type: string
          format: date-time
        changedByUser:
          $ref: "#/components/schemas/User"
          nullable: true
      required: [id, entityType, entityId, changedByUserId, fromStatus, toStatus, changedAt]

    # ── Bug Schemas ──────────────────────────────────────────────────────────
    Bug:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        defectId:
          type: integer
        bugNumber:
          type: integer
        supportTicketNumber:
          type: string
          nullable: true
        assignedDeveloperId:
          type: integer
          nullable: true
        status:
          type: string
        developerNotes:
          type: string
          nullable: true
        failedToResolveReason:
          type: string
          nullable: true
        openedAt:
          type: string
          format: date-time
        assignedAt:
          type: string
          format: date-time
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        testAt:
          type: string
          format: date-time
          nullable: true
        failedToResolveAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        defect:
          $ref: "#/components/schemas/Defect"
          nullable: true
        assignedDeveloper:
          $ref: "#/components/schemas/User"
          nullable: true
        auditLog:
          type: array
          items:
            $ref: "#/components/schemas/StatusAuditLogEntry"
      required: [id, projectId, defectId, bugNumber, status, openedAt, createdAt, updatedAt]

    AssignBugBody:
      type: object
      properties:
        developerId:
          type: integer
        supportTicketNumber:
          type: string
      required: [developerId]

    UpdateBugStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [OPEN, ASSIGNED, RESOLVED, TEST, FAILED_TO_RESOLVE, CLOSED]
        reason:
          type: string
      required: [status]

    UpdateBugNotesBody:
      type: object
      properties:
        notes:
          type: string
      required: [notes]

    ReassignBugBody:
      type: object
      properties:
        developerId:
          type: integer
      required: [developerId]

    # ── Team Discussion Schemas ──────────────────────────────────────────────
    TeamDiscussion:
      type: object
      properties:
        id:
          type: integer
        projectId:
          type: integer
        testRunId:
          type: integer
        initiatedByUserId:
          type: integer
        meetingType:
          type: string
          enum: [defect_review, post_mortem]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        participants:
          type: array
          items:
            $ref: "#/components/schemas/DiscussionParticipant"
        initiatedBy:
          $ref: "#/components/schemas/User"
          nullable: true
      required: [id, projectId, testRunId, initiatedByUserId, meetingType, isActive, createdAt]

    DiscussionParticipant:
      type: object
      properties:
        id:
          type: integer
        discussionId:
          type: integer
        userId:
          type: integer
        canAddNotes:
          type: boolean
        addedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
          nullable: true
      required: [id, discussionId, userId, canAddNotes, addedAt]

    CreateDiscussionBody:
      type: object
      properties:
        meetingType:
          type: string
          enum: [defect_review, post_mortem]
        participantIds:
          type: array
          items:
            type: integer
      required: [meetingType, participantIds]

    AddParticipantBody:
      type: object
      properties:
        userId:
          type: integer
        canAddNotes:
          type: boolean
          default: false
      required: [userId]

    # ── Developer Dashboard ─────────────────────────────────────────────────
    DeveloperBugItem:
      type: object
      properties:
        id:
          type: integer
        bugNumber:
          type: integer
        supportTicketNumber:
          type: string
          nullable: true
        projectId:
          type: integer
        projectName:
          type: string
        defectId:
          type: integer
        testCaseName:
          type: string
        status:
          type: string
        developerNotes:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
